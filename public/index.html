  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { OutlinePass } from 'three/addons/postprocessing/OutlinePass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { GammaCorrectionShader } from 'three/addons/shaders/GammaCorrectionShader.js';

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token') || '';
    const authHeaders = token ? { 'x-usernode-token': token } : {};

    // ── Renderer ──────────────────────────────────────────────────────────────
    const canvas = document.createElement('canvas');
    document.body.appendChild(canvas);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setClearColor(0x0a0a0a);

    // ── Scene ─────────────────────────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0a);

    // ── Camera state & controller ─────────────────────────────────────────────
    const camState = {
      target: new THREE.Vector3(6, 0, 6),
      viewSize: 22,
      liveAzimuth: 0,   // degrees, current live value (animates during snap)
      azimuth: 0,       // last snapped cardinal (0/90/180/270)
      snapTarget: 0,
      isSnapping: false,
    };

    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);
    const FACING_NAMES = { 0: 'NE', 90: 'NW', 180: 'SW', 270: 'SE' };
    const ISO_ELEV = 35.264 * Math.PI / 180;

    function updateCamera() {
      const aspect = window.innerWidth / window.innerHeight;
      camera.left   = -camState.viewSize * aspect;
      camera.right  =  camState.viewSize * aspect;
      camera.top    =  camState.viewSize;
      camera.bottom = -camState.viewSize;
      const az = camState.liveAzimuth * Math.PI / 180;
      const r  = camState.viewSize * 2;
      camera.position.set(
        camState.target.x + r * Math.cos(ISO_ELEV) * Math.sin(az),
        camState.target.y + r * Math.sin(ISO_ELEV),
        camState.target.z + r * Math.cos(ISO_ELEV) * Math.cos(az)
      );
      camera.lookAt(camState.target);
      camera.updateProjectionMatrix();
    }

    updateCamera();

    function snapAzimuth() {
      const normalized = ((camState.liveAzimuth % 360) + 360) % 360;
      const cardinals = [0, 90, 180, 270, 360];
      let best = 0, bestDist = Infinity;
      for (const c of cardinals) {
        const d = Math.abs(normalized - c);
        if (d < bestDist) { bestDist = d; best = c % 360; }
      }
      camState.snapTarget = best;
      camState.isSnapping = true;
    }

    function updateCompass(az) {
      const snap = (Math.round(az / 90) * 90 + 360) % 360;
      document.getElementById('compass').textContent = `◆ ${FACING_NAMES[snap] || '—'}`;
    }

    // ── Lights ────────────────────────────────────────────────────────────────
    const ambient = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(10, 20, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    // ── Gradient map for toon shading ─────────────────────────────────────────
    function makeToonGradient() {
      const c = document.createElement('canvas');
      c.width = 4; c.height = 1;
      const ctx = c.getContext('2d');
      const g = ctx.createLinearGradient(0, 0, 4, 0);
      g.addColorStop(0, '#222'); g.addColorStop(0.4, '#888');
      g.addColorStop(0.7, '#ddd'); g.addColorStop(1, '#fff');
      ctx.fillStyle = g; ctx.fillRect(0, 0, 4, 1);
      const tex = new THREE.CanvasTexture(c);
      tex.minFilter = THREE.NearestFilter;
      tex.magFilter = THREE.NearestFilter;
      return tex;
    }
    const gradientMap = makeToonGradient();

    // ── Materials ─────────────────────────────────────────────────────────────
    const texLoader = new THREE.TextureLoader();
    texLoader.load('/assets/hatch.png', t => {
      t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2, 2);
    });

    function toonMat(color, opacity = 1) {
      return new THREE.MeshToonMaterial({
        color: new THREE.Color(color), gradientMap,
        transparent: opacity < 1, opacity,
      });
    }

    const matFloor = toonMat(0xdddddd);
    const matWall  = toonMat(0xf5f5f5);

    function makeLabelSprite(text) {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 64;
      const ctx = c.getContext('2d');
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.roundRect ? ctx.roundRect(2, 2, 252, 60, 6) : ctx.fillRect(2, 2, 252, 60);

      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.strokeRect(2, 2, 252, 60);

      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, 128, 32);
      const tex = new THREE.CanvasTexture(c);
      const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(2.2, 0.55, 1);
      return sprite;
    }

      } else if (type === 'backyard') {
        P.push({ geo: new THREE.CylinderGeometry(0.12, 0.15, 1.0, 8), mat: matDark, x: -0.8, y: 0.5, z: -0.8 });
        P.push({ geo: new THREE.SphereGeometry(0.45, 8, 8), mat: toonMat(0x888888), x: -0.8, y: 1.2, z: -0.8 });
        P.push({ geo: new THREE.BoxGeometry(0.9, 0.07, 0.25), mat: matFurn, x: 0.6, y: 0.4, z: 0.4 });
        P.push({ geo: new THREE.BoxGeometry(0.07, 0.4, 0.07), mat: matFurn, x: 0.25, y: 0.2, z: 0.32 });
        P.push({ geo: new THREE.BoxGeometry(0.07, 0.4, 0.07), mat: matFurn, x: 0.95, y: 0.2, z: 0.32 });
      } else if (type === 'storage') {
        for (let i = 0; i < 2; i++) {
          P.push({ geo: new THREE.BoxGeometry(0.07, 1.4, 0.07), mat: matDark, x: -1.0 + i * 1.8, y: 0.7, z: -1.2 });
          P.push({ geo: new THREE.BoxGeometry(0.07, 1.4, 0.07), mat: matDark, x: -1.0 + i * 1.8, y: 0.7, z: -0.85 });
          for (let j = 0; j < 3; j++)
            P.push({ geo: new THREE.BoxGeometry(1.8, 0.05, 0.4), mat: matFurn, x: -0.1 + i * 0.9, y: 0.3 + j * 0.45, z: -1.0 });
        }
        P.push({ geo: new THREE.BoxGeometry(0.4, 0.35, 0.35), mat: toonMat(0x777777), x: 0.5, y: 0.175, z: 0.5 });
      } else if (type === 'reading') {
        P.push({ geo: new THREE.BoxGeometry(0.75, 0.3, 0.65), mat: matDark, x: -0.6, y: 0.15, z: 0.2 });
        P.push({ geo: new THREE.BoxGeometry(0.75, 0.55, 0.12), mat: matDark, x: -0.6, y: 0.5, z: 0.52 });
        P.push({ geo: new THREE.BoxGeometry(0.12, 0.45, 0.65), mat: matDark, x: -0.97, y: 0.37, z: 0.2 });
        P.push({ geo: new THREE.BoxGeometry(0.12, 0.45, 0.65), mat: matDark, x: -0.22, y: 0.37, z: 0.2 });
        P.push({ geo: new THREE.BoxGeometry(1.0, 1.4, 0.25), mat: matDark, x: 0.9, y: 0.7, z: -1.2 });
        P.push({ geo: new THREE.CylinderGeometry(0.02, 0.04, 1.4, 6), mat: matFurn, x: -0.1, y: 0.7, z: -0.3 });
        P.push({ geo: new THREE.ConeGeometry(0.18, 0.25, 8), mat: matFurn, x: -0.1, y: 1.45, z: -0.3 });
      }
      for (const p of P) {
        const mesh = new THREE.Mesh(p.geo, p.mat);
        mesh.position.set(p.x, p.y, p.z);
        mesh.castShadow = true; mesh.receiveShadow = true;
        group.add(mesh);
      }
    }

    function makeWall(w, h, d) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matWall);
      m.castShadow = true; m.receiveShadow = true;
      return m;
    }

    function buildRoom(roomDef) {
      const { slug, label, gridX, gridZ, type } = roomDef;
      const group = new THREE.Group();
      const ox = gridX * GRID_SPACING;
      const oz = gridZ * GRID_SPACING;
      group.position.set(ox, 0, oz);

      if (type === 'corridor') {
        const floor = new THREE.Mesh(new THREE.BoxGeometry(ROOM_W, 0.1, ROOM_D), matCorr);
        floor.position.y = -0.05; floor.receiveShadow = true;
        group.add(floor); scene.add(group); return;
      }

      // Floor
      const floor = new THREE.Mesh(new THREE.BoxGeometry(ROOM_W, 0.1, ROOM_D), matFloor);
      floor.position.y = -0.05; floor.receiveShadow = true;
      group.add(floor);

      // All four walls — default visibility matches azimuth=0 (NE: negX and negZ visible)
      const negZWall = makeWall(ROOM_W, WALL_H, WALL_T);
      negZWall.position.set(0, WALL_H / 2, -ROOM_D / 2);
      negZWall.visible = true;
      group.add(negZWall);

      const negXWall = makeWall(WALL_T, WALL_H, ROOM_D);
      negXWall.position.set(-ROOM_W / 2, WALL_H / 2, 0);
      negXWall.visible = true;
      group.add(negXWall);

      const posXWall = makeWall(WALL_T, WALL_H, ROOM_D);
      posXWall.position.set(ROOM_W / 2, WALL_H / 2, 0);
      posXWall.visible = false;
      group.add(posXWall);

      const posZWall = makeWall(ROOM_W, WALL_H, WALL_T);
      posZWall.position.set(0, WALL_H / 2, ROOM_D / 2);
      posZWall.visible = false;
      group.add(posZWall);

      group.userData.walls = { negX: negXWall, posX: posXWall, negZ: negZWall, posZ: posZWall };

      addFurniture(group, type);

      // Red overlay (hidden by default)
      const overlay = new THREE.Mesh(
        new THREE.PlaneGeometry(ROOM_W - 0.1, ROOM_D - 0.1),
        new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0, depthWrite: false })
      );
      overlay.rotation.x = -Math.PI / 2;
      overlay.position.y = 0.06;
      group.add(overlay);
      if (slug) roomOverlays[slug] = overlay;

      if (label) {
        const sprite = makeLabelSprite(label);
        sprite.position.set(0, 2.4, 0);
        group.add(sprite);
      }

      scene.add(group);
      if (slug) { roomGroups[slug] = group; roomCenters[slug] = { x: ox, z: oz }; }
    }

    for (const r of ROOMS) buildRoom(r);

    // ── Wall visibility by azimuth ─────────────────────────────────────────────
    // Azimuth 0 (NE): negX and negZ visible (camera is at +X,+Z from scene)
    // Azimuth 90 (NW): posX and negZ visible
    // Azimuth 180 (SW): posX and posZ visible
    // Azimuth 270 (SE): negX and posZ visible
    function updateWallsForAzimuth(az) {
      const snap = (Math.round(az / 90) * 90 + 360) % 360;
      for (const slug of Object.keys(roomGroups)) {
        const walls = roomGroups[slug].userData.walls;
        if (!walls) continue;
        walls.negX.visible = (snap === 0 || snap === 270);
        walls.posX.visible = (snap === 90 || snap === 180);
        walls.negZ.visible = (snap === 0 || snap === 90);
        walls.posZ.visible = (snap === 180 || snap === 270);
      }
    }

    // ── Pocong ghost sprite ───────────────────────────────────────────────────
    let pocongSprite = null;
    const pocongTex = texLoader.load('/assets/pocong.jpg', () => {
      const mat = new THREE.SpriteMaterial({ map: pocongTex, depthTest: false });
      pocongSprite = new THREE.Sprite(mat);
      pocongSprite.scale.set(1.0, 1.5, 1);
      pocongSprite.position.set(4, 0.9, 12);
      scene.add(pocongSprite);
    });

    // ── Player tokens ─────────────────────────────────────────────────────────
    const playerSprites = [];

    function makeTokenSprite(initial, color) {
      const c = document.createElement('canvas');
      c.width = 64; c.height = 64;
      const ctx = c.getContext('2d');
      ctx.fillStyle = color || '#555';
      ctx.beginPath(); ctx.arc(32, 32, 28, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(initial.toUpperCase(), 32, 33);
      const tex = new THREE.CanvasTexture(c);
      const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(0.38, 0.38, 1);
      return sprite;
    }

    const TOKEN_COLORS = ['#555','#444','#666','#333','#777','#222','#888','#111'];

    function placePlayerTokens(players) {
      for (const s of playerSprites) scene.remove(s);
      playerSprites.length = 0;
      for (let i = 0; i < Math.min(players.length, 50); i++) {
        const p = players[i];
        const center = roomCenters[p.room_slug];
        if (!center) continue;
        const sprite = makeTokenSprite(p.username[0], TOKEN_COLORS[i % TOKEN_COLORS.length]);
        const rx = (Math.random() - 0.5) * (ROOM_W - 0.8);
        const rz = (Math.random() - 0.5) * (ROOM_D - 0.8);
        sprite.position.set(center.x + rx, 0.5, center.z + rz);
        sprite.userData.slug = p.room_slug;
        sprite.userData.username = p.username;
        scene.add(sprite);
        playerSprites.push(sprite);
      }
    }

    // ── Post-processing ───────────────────────────────────────────────────────
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));

    const outlinePass = new OutlinePass(
      new THREE.Vector2(window.innerWidth, window.innerHeight), scene, camera
    );
    outlinePass.edgeStrength = 4.0;
    outlinePass.edgeGlow = 0;
    outlinePass.edgeThickness = 2.0;
    outlinePass.visibleEdgeColor.set('#000000');
    outlinePass.hiddenEdgeColor.set('#000000');
    composer.addPass(outlinePass);

    const gammaPass = new ShaderPass(GammaCorrectionShader);
    composer.addPass(gammaPass);

    function refreshOutlineObjects() {
      const objs = [];
      scene.traverse(obj => { if (obj.isMesh) objs.push(obj); });
      outlinePass.selectedObjects = objs;
    }
    refreshOutlineObjects();

    // ── Game state & HUD ──────────────────────────────────────────────────────
    let currentState = { round: null, bet: null, players: [] };
    let selectedRoom = null;
    let lastRoundId = null;
    let lastStatus  = null;
    let lastPlayersJson = '';

    function updateHUD(state) {
      const { round, bet } = state;
      if (round) document.getElementById('status-round').textContent = `round: ${round.round_number}`;
      if (bet) {
        document.getElementById('status-bet').textContent = `bet: ${bet.amount_tkn} TKN`;
        const outcomeEl = document.getElementById('status-outcome');
        if (bet.outcome === 'won') {
          outcomeEl.textContent = 'status: won 🎉';
          const wEl = document.getElementById('tkn-winnings');
          wEl.style.display = 'block';
          wEl.textContent = `+${bet.amount_tkn} TKN`;
        } else if (bet.outcome === 'lost') {
          outcomeEl.textContent = 'status: lost 💀';
        } else {
          outcomeEl.textContent = 'status: bet placed';
        }
      } else {
        document.getElementById('status-bet').textContent = 'bet: — TKN';
        document.getElementById('status-outcome').textContent = 'status: watching';
      }

      // Dev controls: show/hide new-round button
      const devPanel = document.getElementById('dev-controls');
      if (devPanel.style.display !== 'none') {
        const newRoundBtn = document.getElementById('btn-newround');
        if (round?.status === 'completed') {
          newRoundBtn.classList.remove('hidden');
        } else {
          newRoundBtn.classList.add('hidden');
        }
      }
    }

    function applyWinState(state) {
      const { round, bet } = state;
      if (!round || round.status !== 'completed' || !round.winner_room) return;

      const overlay = roomOverlays[round.winner_room];
      if (overlay) overlay.material.opacity = 0.45;

      for (const s of playerSprites) {
        if (s.userData.slug === round.winner_room) s.material.color.set(0x444444);
      }

      const banner = document.getElementById('win-banner');
      const winText = document.getElementById('win-text');
      const winSub  = document.getElementById('win-sub');
      if (bet && bet.outcome === 'won') {
        winText.textContent = 'You Win! 🎉';
        const lbl = ROOMS.find(r => r.slug === round.winner_room)?.label || round.winner_room;
        winSub.textContent = `The Pocong entered ${lbl}. You were safe!`;
        banner.style.display = 'block';
      } else if (bet && bet.outcome === 'lost') {
        winText.textContent = 'You Lose! 💀';
        winText.style.color = '#888';
        winSub.textContent = 'The Pocong found you...';
        banner.style.display = 'block';
      }

      if (pocongSprite && roomCenters[round.winner_room]) {
        const c = roomCenters[round.winner_room];
        pocongSprite.position.set(c.x, 0.9, c.z);
      }

      if (bet && bet.outcome === 'won' && bet.room_slug === 'library') {
        for (const s of playerSprites) {
          if (s.userData.slug === 'library') s.scale.setScalar(1.1);
        }
      }
    }

    function clearWinState() {
      for (const slug of Object.keys(roomOverlays)) roomOverlays[slug].material.opacity = 0;
      for (const s of playerSprites) { s.material.color.set(0xffffff); s.scale.set(0.38, 0.38, 1); }
      const banner = document.getElementById('win-banner');
      banner.style.display = 'none';
      const winText = document.getElementById('win-text');
      winText.style.color = '';
    }

    async function pollState() {
      try {
        const res = await fetch('/api/game/state', { headers: authHeaders });
        if (!res.ok) return;
        const state = await res.json();
        currentState = state;
        updateHUD(state);

        const roundChanged   = state.round?.id !== lastRoundId;
        const statusChanged  = state.round?.status !== lastStatus;
        const playersJson    = JSON.stringify(state.players || []);
        const playersChanged = playersJson !== lastPlayersJson;

        if (roundChanged || statusChanged || playersChanged) {
          if (roundChanged || statusChanged) clearWinState();
          placePlayerTokens(state.players || []);

          if (state.round?.status === 'completed') applyWinState(state);

          lastRoundId    = state.round?.id;
          lastStatus     = state.round?.status;
          lastPlayersJson = playersJson;

          refreshOutlineObjects();
        }
      } catch (e) {
        console.warn('Poll error:', e.message);
      }
    }

    pollState();
    setInterval(pollState, 3000);

    // ── Camera input — pan, zoom, rotate ─────────────────────────────────────
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const xzPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

    function getPlanePoint(screenX, screenY) {
      mouse.x =  (screenX / window.innerWidth)  * 2 - 1;
      mouse.y = -(screenY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const pt = new THREE.Vector3();
      raycaster.ray.intersectPlane(xzPlane, pt);
      return pt;
    }

    let panActive = false, rotActive = false, didDrag = false;
    let panStartX = 0, panStartY = 0;
    let panWorldStart = null;
    const panTargetStart = new THREE.Vector3();
    let rotStartX = 0, rotStartAzimuth = 0;

    const CLAMP_MIN = -4, CLAMP_MAX = 16;

    canvas.addEventListener('contextmenu', e => e.preventDefault());

    canvas.addEventListener('mousedown', e => {
      if (e.button === 0) {
        panActive = true; didDrag = false;
        panStartX = e.clientX; panStartY = e.clientY;
        panWorldStart = getPlanePoint(e.clientX, e.clientY);
        panTargetStart.copy(camState.target);
        canvas.classList.add('panning');
      } else if (e.button === 2) {
        rotActive = true;
        rotStartX = e.clientX;
        rotStartAzimuth = camState.liveAzimuth;
        camState.isSnapping = false;
        canvas.classList.add('rotating');
      }
    });

    window.addEventListener('mousemove', e => {
      if (panActive) {
        const dx = e.clientX - panStartX;
        const dy = e.clientY - panStartY;
        if (Math.hypot(dx, dy) > 4) didDrag = true;
        if (didDrag && panWorldStart) {
          const curr = getPlanePoint(e.clientX, e.clientY);
          if (curr.length() > 0) {
            const deltaX = panWorldStart.x - curr.x;
            const deltaZ = panWorldStart.z - curr.z;
            camState.target.x = Math.max(CLAMP_MIN, Math.min(CLAMP_MAX, panTargetStart.x + deltaX));
            camState.target.z = Math.max(CLAMP_MIN, Math.min(CLAMP_MAX, panTargetStart.z + deltaZ));
            updateCamera();
          }
        }
      }
      if (rotActive) {
        const dx = e.clientX - rotStartX;
        camState.liveAzimuth = rotStartAzimuth + dx * 0.35;
        updateCamera();
      }
    });

    window.addEventListener('mouseup', e => {
      if (e.button === 0) {
        if (!didDrag) handleClick(e);
        panActive = false; panWorldStart = null; didDrag = false;
        canvas.classList.remove('panning');
      }
      if (e.button === 2) {
        if (rotActive) snapAzimuth();
        rotActive = false;
        canvas.classList.remove('rotating');
      }
    });

    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      camState.viewSize = Math.max(8, Math.min(40, camState.viewSize + e.deltaY * 0.05));
      updateCamera();
    }, { passive: false });

    // ── Touch controls ────────────────────────────────────────────────────────
    let touchPanStart = null;
    const touchPanTargetStart = new THREE.Vector3();
    let lastPinchDist = null;
    let lastTouchAngle = null;
    let touchRotStartAzimuth = 0;

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const tArr = Array.from(e.touches);
      if (tArr.length === 1) {
        touchPanStart = getPlanePoint(tArr[0].clientX, tArr[0].clientY);
        touchPanTargetStart.copy(camState.target);
        lastPinchDist = null; lastTouchAngle = null;
      } else if (tArr.length === 2) {
        lastPinchDist = Math.hypot(
          tArr[0].clientX - tArr[1].clientX,
          tArr[0].clientY - tArr[1].clientY
        );
        lastTouchAngle = Math.atan2(
          tArr[0].clientY - tArr[1].clientY,
          tArr[0].clientX - tArr[1].clientX
        );
        touchRotStartAzimuth = camState.liveAzimuth;
        camState.isSnapping = false;
        touchPanStart = null;
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const tArr = Array.from(e.touches);
      if (tArr.length === 1 && touchPanStart) {
        const curr = getPlanePoint(tArr[0].clientX, tArr[0].clientY);
        if (curr.length() > 0) {
          camState.target.x = Math.max(CLAMP_MIN, Math.min(CLAMP_MAX, touchPanTargetStart.x + touchPanStart.x - curr.x));
          camState.target.z = Math.max(CLAMP_MIN, Math.min(CLAMP_MAX, touchPanTargetStart.z + touchPanStart.z - curr.z));
          updateCamera();
        }
      } else if (tArr.length === 2) {
        const dist = Math.hypot(
          tArr[0].clientX - tArr[1].clientX,
          tArr[0].clientY - tArr[1].clientY
        );
        if (lastPinchDist && dist > 0) {
          camState.viewSize = Math.max(8, Math.min(40, camState.viewSize * (lastPinchDist / dist)));
          updateCamera();
        }
        lastPinchDist = dist;

        const angle = Math.atan2(
          tArr[0].clientY - tArr[1].clientY,
          tArr[0].clientX - tArr[1].clientX
        );
        if (lastTouchAngle !== null) {
          const delta = (angle - lastTouchAngle) * (180 / Math.PI);
          camState.liveAzimuth += delta * 0.5;
          updateCamera();
        }
        lastTouchAngle = angle;
      }
    }, { passive: false });

    canvas.addEventListener('touchend', e => {
      e.preventDefault();
      if (Array.from(e.touches).length < 2) {
        snapAzimuth();
        lastPinchDist = null; lastTouchAngle = null;
      }
      if (Array.from(e.touches).length === 0) touchPanStart = null;
    }, { passive: false });

    // ── Room click / bet modal ────────────────────────────────────────────────
    function handleClick(e) {
      if (!currentState.round || currentState.round.status !== 'active') return;
      if (currentState.bet) return;

      mouse.x =  (e.clientX / window.innerWidth)  * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(scene.children, true);
      if (!intersects.length) return;

      const pos = intersects[0].point;
      const hitRoom = ROOMS.find(r => {
        if (!r.slug) return false;
        const cx = r.gridX * GRID_SPACING;
        const cz = r.gridZ * GRID_SPACING;
        return Math.abs(pos.x - cx) < ROOM_W / 2 + 0.1 && Math.abs(pos.z - cz) < ROOM_D / 2 + 0.1;
      });

      if (hitRoom && hitRoom.slug) {
        selectedRoom = hitRoom;
        document.getElementById('modal-title').textContent = 'Place Your Bet';
        document.getElementById('modal-room').textContent = `Room: ${hitRoom.label}`;
        document.getElementById('bet-modal').style.display = 'block';
      }
    }

    document.getElementById('modal-cancel').addEventListener('click', () => {
      document.getElementById('bet-modal').style.display = 'none';
      selectedRoom = null;
    });

    document.getElementById('modal-confirm').addEventListener('click', async () => {
      if (!selectedRoom) return;
      document.getElementById('bet-modal').style.display = 'none';
      try {
        const res = await fetch('/api/game/bet', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeaders },
          body: JSON.stringify({ room_slug: selectedRoom.slug, amount_tkn: 1000 }),
        });
        if (res.ok) await pollState();
        else { const err = await res.json(); alert(err.error || 'Bet failed'); }
      } catch (e) { console.error(e); }
      selectedRoom = null;
    });

    // ── Dev Controls (staging only) ───────────────────────────────────────────
    async function callAdvance() {
      const res = await fetch('/api/game/advance', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders },
        body: JSON.stringify({}),
      });
      if (!res.ok) { const e = await res.json(); throw new Error(e.error || 'advance failed'); }
      return res.json();
    }

    document.getElementById('btn-resolve').addEventListener('click', async () => {
      try {
        await callAdvance(); // active → resolving
        await callAdvance(); // resolving → completed
        await pollState();
      } catch (e) { alert(e.message); }
    });

    document.getElementById('btn-newround').addEventListener('click', async () => {
      try {
        await callAdvance(); // completed → new active round
        await pollState();
      } catch (e) { alert(e.message); }
    });

    fetch('/api/game/env')
      .then(r => r.json())
      .then(({ isStaging }) => {
        if (isStaging) document.getElementById('dev-controls').style.display = 'block';
      })
      .catch(() => {});

    // ── Animation loop ────────────────────────────────────────────────────────
    let t = 0;
    const corridorPath = [
      { x: 4, z: 12 }, { x: 8, z: 12 }, { x: 12, z: 12 },
      { x: 12, z: 8 }, { x: 12, z: 4 }, { x: 12, z: 0 },
    ];
    let pathIdx = 0, pathProgress = 0;

    function animate() {
      requestAnimationFrame(animate);
      t += 0.016;

      // Azimuth snap animation
      if (camState.isSnapping) {
        let target  = camState.snapTarget;
        let current = ((camState.liveAzimuth % 360) + 360) % 360;
        let diff = target - current;
        if (diff > 180) diff -= 360;
        if (diff < -180) diff += 360;
        if (Math.abs(diff) < 0.3) {
          camState.liveAzimuth = target;
          camState.isSnapping = false;
          camState.azimuth = target;
          updateWallsForAzimuth(target);
          updateCompass(target);
        } else {
          camState.liveAzimuth = current + diff * 0.14;
        }
        updateCamera();
      }

      // Ghost patrol
      if (pocongSprite && currentState.round?.status !== 'completed') {
        const a = corridorPath[pathIdx];
        const b = corridorPath[(pathIdx + 1) % corridorPath.length];
        pathProgress += 0.003;
        if (pathProgress >= 1) { pathProgress = 0; pathIdx = (pathIdx + 1) % corridorPath.length; }
        pocongSprite.position.x = a.x + (b.x - a.x) * pathProgress;
        pocongSprite.position.z = a.z + (b.z - a.z) * pathProgress;
        pocongSprite.position.y = 0.9 + Math.sin(t * 2) * 0.08;
      } else if (pocongSprite) {
        pocongSprite.position.y = 0.9 + Math.sin(t * 2) * 0.08;
      }

      composer.render();
    }

    animate();

    // ── Resize ────────────────────────────────────────────────────────────────
    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      updateCamera();
    });
  </script>
</body>
</html>
