  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { OutlinePass } from 'three/addons/postprocessing/OutlinePass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { GammaCorrectionShader } from 'three/addons/shaders/GammaCorrectionShader.js';

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    const authHeaders = token ? { 'x-usernode-token': token } : {};

    // ── Renderer ──────────────────────────────────────────────────────────────
    const canvas = document.createElement('canvas');
    document.body.appendChild(canvas);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setClearColor(0x0a0a0a);

    // ── Scene ─────────────────────────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0a);

    // ── Camera (isometric) ────────────────────────────────────────────────────
    const aspect = window.innerWidth / window.innerHeight;
    const viewSize = 22;
    const camera = new THREE.OrthographicCamera(
      -viewSize * aspect, viewSize * aspect,
      viewSize, -viewSize, 0.1, 200
    );
    // True isometric angle: position at equal distances on X, Y, Z
    camera.position.set(24, 24, 24);
    camera.lookAt(6, 0, 6);

    // ── Lights ────────────────────────────────────────────────────────────────
    const ambient = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(10, 20, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    // ── Gradient map for toon shading (3 steps) ───────────────────────────────
    function makeToonGradient() {
      const canvas2 = document.createElement('canvas');
      canvas2.width = 4; canvas2.height = 1;
      const ctx = canvas2.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 4, 0);
      grad.addColorStop(0, '#222222');
      grad.addColorStop(0.4, '#888888');
      grad.addColorStop(0.7, '#dddddd');
      grad.addColorStop(1, '#ffffff');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 4, 1);
      const tex = new THREE.CanvasTexture(canvas2);
      tex.minFilter = THREE.NearestFilter;
      tex.magFilter = THREE.NearestFilter;
      return tex;
    }
    const gradientMap = makeToonGradient();

    // ── Materials ─────────────────────────────────────────────────────────────
    const texLoader = new THREE.TextureLoader();
    let hatchTex = null;
    texLoader.load('/assets/hatch.png', t => {
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(2, 2);
      hatchTex = t;
    });

    function toonMat(color, opacity = 1) {
      return new THREE.MeshToonMaterial({
        color: new THREE.Color(color),
        gradientMap,
        transparent: opacity < 1,
        opacity,
      });
    }

    const matFloor   = toonMat(0xdddddd);
    const matWall    = toonMat(0xf5f5f5);
    const matFurn    = toonMat(0x999999);
    const matDark    = toonMat(0x444444);
    const matCorr    = toonMat(0xbbbbbb);

    // ── Room definitions ──────────────────────────────────────────────────────
    const ROOMS = [
      { slug: 'kamar-utama',      label: 'Kamar Utama',       gridX: 0, gridZ: 0, type: 'bedroom' },
      { slug: 'library',          label: 'Library',           gridX: 1, gridZ: 0, type: 'library' },
      { slug: 'kamar-asisten',    label: 'Kamar Asisten',     gridX: 2, gridZ: 0, type: 'bedroom' },
      { slug: 'laundry-area',     label: 'Laundry Area',      gridX: 3, gridZ: 0, type: 'laundry' },
      { slug: 'kitchen-area',     label: 'Kitchen Area',      gridX: 0, gridZ: 1, type: 'kitchen' },
      { slug: 'kamar-anak',       label: 'Kamar Anak-Anak',   gridX: 1, gridZ: 1, type: 'bedroom' },
      { slug: 'playing-room',     label: 'Playing Room',      gridX: 2, gridZ: 1, type: 'playroom' },
      { slug: 'living-room',      label: 'Living Room',       gridX: 3, gridZ: 1, type: 'living' },
      { slug: 'kamar-mandi',      label: 'Kamar Mandi',       gridX: 0, gridZ: 2, type: 'bathroom' },
      { slug: 'kamar-mandi-kedua',label: 'Kamar Mandi Kedua', gridX: 1, gridZ: 2, type: 'bathroom' },
      { slug: 'backyard',         label: 'Backyard',          gridX: 2, gridZ: 2, type: 'backyard' },
      { slug: 'gudang',           label: 'Gudang',            gridX: 3, gridZ: 2, type: 'storage' },
      { slug: 'ruang-baca',       label: 'Ruang Baca',        gridX: 0, gridZ: 3, type: 'reading' },
      // Corridor cells (no slug/label, just floor)
      { slug: null, label: null, gridX: 1, gridZ: 3, type: 'corridor' },
      { slug: null, label: null, gridX: 2, gridZ: 3, type: 'corridor' },
      { slug: null, label: null, gridX: 3, gridZ: 3, type: 'corridor' },
    ];

    const GRID_SPACING = 4;
    const ROOM_W = 3.6, ROOM_D = 3.6, WALL_H = 1.8, WALL_T = 0.1;

    const roomGroups = {}; // slug -> THREE.Group
    const roomOverlays = {}; // slug -> red overlay mesh
    const roomCenters = {}; // slug -> {x, z}

    function makeLabelSprite(text) {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 64;
      const ctx = c.getContext('2d');
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.roundRect ? ctx.roundRect(2, 2, 252, 60, 6) : ctx.fillRect(2, 2, 252, 60);
      ctx.fill();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;
      ctx.strokeRect(2, 2, 252, 60);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, 128, 32);
      const tex = new THREE.CanvasTexture(c);
      const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(2.2, 0.55, 1);
      return sprite;
    }

    function addFurniture(group, type) {
      const pieces = [];
      if (type === 'bedroom') {
        // Bed
        pieces.push({ geo: new THREE.BoxGeometry(1.4, 0.25, 0.9), mat: matFurn, x: 0.6, y: 0.125, z: 0.2 });
        pieces.push({ geo: new THREE.BoxGeometry(1.4, 0.1, 0.25), mat: matDark, x: 0.6, y: 0.25, z: -0.3 });
        // Wardrobe
        pieces.push({ geo: new THREE.BoxGeometry(0.5, 1.2, 0.3), mat: matDark, x: -1.2, y: 0.6, z: -1.2 });
        pieces.push({ geo: new THREE.BoxGeometry(0.5, 1.2, 0.3), mat: matDark, x: -0.65, y: 0.6, z: -1.2 });
      } else if (type === 'library') {
        // Bookshelves (back wall)
        for (let i = 0; i < 3; i++) {
          pieces.push({ geo: new THREE.BoxGeometry(0.8, 1.6, 0.25), mat: matDark, x: -1.1 + i * 0.85, y: 0.8, z: -1.3 });
          // Shelf dividers
          for (let j = 0; j < 3; j++) {
            pieces.push({ geo: new THREE.BoxGeometry(0.8, 0.05, 0.2), mat: matFurn, x: -1.1 + i * 0.85, y: 0.4 + j * 0.5, z: -1.28 });
          }
        }
        // Reading desk
        pieces.push({ geo: new THREE.BoxGeometry(0.8, 0.07, 0.5), mat: matFurn, x: 0.8, y: 0.5, z: 0.5 });
        pieces.push({ geo: new THREE.BoxGeometry(0.07, 0.5, 0.07), mat: matFurn, x: 0.5, y: 0.25, z: 0.3 });
        pieces.push({ geo: new THREE.BoxGeometry(0.07, 0.5, 0.07), mat: matFurn, x: 1.1, y: 0.25, z: 0.3 });
      } else if (type === 'laundry') {
        // Washing machine (cylinder)
        pieces.push({ geo: new THREE.CylinderGeometry(0.35, 0.35, 0.8, 12), mat: matFurn, x: -0.8, y: 0.4, z: -0.8 });
        // Basket

        // Clothesline pole

      } else if (type === 'kitchen') {
        // Counter
        pieces.push({ geo: new THREE.BoxGeometry(2.0, 0.65, 0.4), mat: matFurn, x: 0, y: 0.325, z: -1.2 });
        // Stove top
        pieces.push({ geo: new THREE.BoxGeometry(0.8, 0.05, 0.4), mat: matDark, x: -0.5, y: 0.68, z: -1.2 });
        // Sink
        pieces.push({ geo: new THREE.BoxGeometry(0.4, 0.05, 0.35), mat: toonMat(0x888888), x: 0.6, y: 0.68, z: -1.2 });
        // Fridge

      } else if (type === 'playroom') {

        // Toy box

      } else if (type === 'bathroom') {

        pieces.push({ geo: new THREE.BoxGeometry(0.45, 0.08, 0.32), mat: matFurn, x: -0.9, y: 0.38, z: -0.9 });
        // Sink

        // Shower area

      } else if (type === 'backyard') {
        // Tree trunk
        pieces.push({ geo: new THREE.CylinderGeometry(0.12, 0.15, 1.0, 8), mat: matDark, x: -0.8, y: 0.5, z: -0.8 });
        pieces.push({ geo: new THREE.SphereGeometry(0.45, 8, 8), mat: toonMat(0x888888), x: -0.8, y: 1.2, z: -0.8 });
        // Bench

        pieces.push({ geo: new THREE.BoxGeometry(0.07, 0.4, 0.07), mat: matFurn, x: 0.95, y: 0.2, z: 0.32 });
      } else if (type === 'storage') {
        // Shelving racks
        for (let i = 0; i < 2; i++) {
          pieces.push({ geo: new THREE.BoxGeometry(0.07, 1.4, 0.07), mat: matDark, x: -1.0 + i * 1.8, y: 0.7, z: -1.2 });
          pieces.push({ geo: new THREE.BoxGeometry(0.07, 1.4, 0.07), mat: matDark, x: -1.0 + i * 1.8, y: 0.7, z: -0.85 });
          for (let j = 0; j < 3; j++) {
            pieces.push({ geo: new THREE.BoxGeometry(1.8, 0.05, 0.4), mat: matFurn, x: -0.1 + i * 0.9, y: 0.3 + j * 0.45, z: -1.0 });
          }
        }
        // Boxes
        pieces.push({ geo: new THREE.BoxGeometry(0.4, 0.35, 0.35), mat: toonMat(0x777777), x: 0.5, y: 0.175, z: 0.5 });
      } else if (type === 'reading') {
        // Armchair
        pieces.push({ geo: new THREE.BoxGeometry(0.75, 0.3, 0.65), mat: matDark, x: -0.6, y: 0.15, z: 0.2 });
        pieces.push({ geo: new THREE.BoxGeometry(0.75, 0.55, 0.12), mat: matDark, x: -0.6, y: 0.5, z: 0.52 });
        pieces.push({ geo: new THREE.BoxGeometry(0.12, 0.45, 0.65), mat: matDark, x: -0.97, y: 0.37, z: 0.2 });
        pieces.push({ geo: new THREE.BoxGeometry(0.12, 0.45, 0.65), mat: matDark, x: -0.22, y: 0.37, z: 0.2 });
        // Bookshelf
        pieces.push({ geo: new THREE.BoxGeometry(1.0, 1.4, 0.25), mat: matDark, x: 0.9, y: 0.7, z: -1.2 });
        // Floor lamp
        pieces.push({ geo: new THREE.CylinderGeometry(0.02, 0.04, 1.4, 6), mat: matFurn, x: -0.1, y: 0.7, z: -0.3 });
        pieces.push({ geo: new THREE.ConeGeometry(0.18, 0.25, 8), mat: matFurn, x: -0.1, y: 1.45, z: -0.3 });
      }

      for (const p of pieces) {
        const mesh = new THREE.Mesh(p.geo, p.mat);
        mesh.position.set(p.x, p.y, p.z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        group.add(mesh);
      }
    }

    function buildRoom(roomDef) {
      const { slug, label, gridX, gridZ, type } = roomDef;
      const group = new THREE.Group();
      const ox = gridX * GRID_SPACING;
      const oz = gridZ * GRID_SPACING;
      group.position.set(ox, 0, oz);

      if (type === 'corridor') {
        const floor = new THREE.Mesh(new THREE.BoxGeometry(ROOM_W, 0.1, ROOM_D), matCorr);
        floor.position.y = -0.05;
        floor.receiveShadow = true;
        group.add(floor);
        scene.add(group);
        return;
      }

      // Floor
      const floor = new THREE.Mesh(new THREE.BoxGeometry(ROOM_W, 0.1, ROOM_D), matFloor);
      floor.position.y = -0.05;
      floor.receiveShadow = true;
      group.add(floor);

      // Walls (back-left and back-right only — camera-facing walls omitted for dollhouse view)
      // Back wall (negative Z)
      const backWall = new THREE.Mesh(new THREE.BoxGeometry(ROOM_W, WALL_H, WALL_T), matWall);
      backWall.position.set(0, WALL_H / 2, -ROOM_D / 2);
      backWall.castShadow = true; backWall.receiveShadow = true;
      group.add(backWall);

      // Left wall (negative X)
      const leftWall = new THREE.Mesh(new THREE.BoxGeometry(WALL_T, WALL_H, ROOM_D), matWall);
      leftWall.position.set(-ROOM_W / 2, WALL_H / 2, 0);
      leftWall.castShadow = true; leftWall.receiveShadow = true;
      group.add(leftWall);

      // Furniture
      addFurniture(group, type);

      // Red overlay (hidden by default)
      const overlay = new THREE.Mesh(
        new THREE.PlaneGeometry(ROOM_W - 0.1, ROOM_D - 0.1),
        new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0, depthWrite: false })
      );
      overlay.rotation.x = -Math.PI / 2;
      overlay.position.y = 0.06;
      group.add(overlay);
      if (slug) roomOverlays[slug] = overlay;

      // Label sprite
      if (label) {
        const sprite = makeLabelSprite(label);
        sprite.position.set(0, 2.4, 0);
        group.add(sprite);
      }

      scene.add(group);
      if (slug) {
        roomGroups[slug] = group;
        roomCenters[slug] = { x: ox, z: oz };
      }
    }

    for (const r of ROOMS) buildRoom(r);

    // ── Pocong ghost sprite ───────────────────────────────────────────────────
    let pocongSprite = null;
    const pocongTex = texLoader.load('/assets/pocong.jpg', () => {
      const mat = new THREE.SpriteMaterial({ map: pocongTex, depthTest: false });
      pocongSprite = new THREE.Sprite(mat);
      pocongSprite.scale.set(1.0, 1.5, 1);
      pocongSprite.position.set(4, 0.9, 12); // Start in corridor
      scene.add(pocongSprite);
    });

    // ── Player tokens ─────────────────────────────────────────────────────────
    const playerSprites = [];

    function makeTokenSprite(initial, color) {
      const c = document.createElement('canvas');
      c.width = 64; c.height = 64;
      const ctx = c.getContext('2d');
      ctx.fillStyle = color || '#555';
      ctx.beginPath(); ctx.arc(32, 32, 28, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(initial.toUpperCase(), 32, 33);
      const tex = new THREE.CanvasTexture(c);
      const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(0.38, 0.38, 1);
      return sprite;
    }

    const TOKEN_COLORS = ['#555','#444','#666','#333','#777','#222','#888','#111'];

    function placePlayerTokens(players) {
      // Remove old tokens
      for (const s of playerSprites) scene.remove(s);
      playerSprites.length = 0;

      for (let i = 0; i < Math.min(players.length, 50); i++) {
        const p = players[i];
        const center = roomCenters[p.room_slug];
        if (!center) continue;
        const sprite = makeTokenSprite(p.username[0], TOKEN_COLORS[i % TOKEN_COLORS.length]);
        // Random scatter within room bounds
        const rx = (Math.random() - 0.5) * (ROOM_W - 0.8);
        const rz = (Math.random() - 0.5) * (ROOM_D - 0.8);
        sprite.position.set(center.x + rx, 0.5, center.z + rz);
        sprite.userData.slug = p.room_slug;
        sprite.userData.username = p.username;
        scene.add(sprite);
        playerSprites.push(sprite);
      }
    }

    // ── Post-processing ───────────────────────────────────────────────────────
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));

    const outlinePass = new OutlinePass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      scene, camera
    );
    outlinePass.edgeStrength = 4.0;
    outlinePass.edgeGlow = 0;
    outlinePass.edgeThickness = 2.0;
    outlinePass.visibleEdgeColor.set('#000000');
    outlinePass.hiddenEdgeColor.set('#000000');
    composer.addPass(outlinePass);

    const gammaPass = new ShaderPass(GammaCorrectionShader);
    composer.addPass(gammaPass);

    // Set outline objects (all solid meshes)
    const outlineObjects = [];
    scene.traverse(obj => { if (obj.isMesh) outlineObjects.push(obj); });
    outlinePass.selectedObjects = outlineObjects;

    // ── Game state & HUD ──────────────────────────────────────────────────────
    let currentState = { round: null, bet: null, players: [] };
    let selectedRoom = null;

    function updateHUD(state) {
      const { round, bet, players } = state;
      if (round) {
        document.getElementById('status-round').textContent = `round: ${round.round_number}`;
      }
      if (bet) {
        document.getElementById('status-bet').textContent = `bet: ${bet.amount_tkn} TKN`;
        const outcomeEl = document.getElementById('status-outcome');
        if (bet.outcome === 'won') {
          outcomeEl.textContent = 'status: won 🎉';
          document.getElementById('tkn-winnings').style.display = 'block';
          document.getElementById('tkn-winnings').textContent = `+${bet.amount_tkn} TKN`;
        } else if (bet.outcome === 'lost') {
          outcomeEl.textContent = 'status: lost 💀';
        } else {
          outcomeEl.textContent = `status: bet placed`;
        }
      } else {
        document.getElementById('status-bet').textContent = 'bet: — TKN';
        document.getElementById('status-outcome').textContent = 'status: watching';
      }
    }

    function applyWinState(state) {
      const { round, bet } = state;
      if (!round || round.status !== 'completed' || !round.winner_room) return;

      // Red overlay on winner room
      const overlay = roomOverlays[round.winner_room];
      if (overlay) {
        overlay.material.opacity = 0.45;
      }

      // Grey out defeated tokens
      for (const s of playerSprites) {
        if (s.userData.slug === round.winner_room) {
          s.material.color.set(0x444444);
        }
      }

      // Show win/loss banner
      const banner = document.getElementById('win-banner');
      const winText = document.getElementById('win-text');
      const winSub = document.getElementById('win-sub');
      if (bet && bet.outcome === 'won') {
        winText.textContent = 'You Win! 🎉';
        const roomLabel = ROOMS.find(r => r.slug === round.winner_room)?.label || round.winner_room;
        winSub.textContent = `The Pocong entered ${roomLabel}. You were safe!`;
        banner.style.display = 'block';
      } else if (bet && bet.outcome === 'lost') {
        winText.textContent = 'You Lose! 💀';
        winSub.textContent = 'The Pocong found you...';
        winText.style.color = '#888';
        banner.style.display = 'block';
      }

      // Move pocong into winner room
      if (pocongSprite && roomCenters[round.winner_room]) {
        const c = roomCenters[round.winner_room];
        pocongSprite.position.set(c.x, 0.9, c.z);
      }

      // Scale up main player token in library (if their bet was library and won)
      if (bet && bet.outcome === 'won' && bet.room_slug === 'library') {
        for (const s of playerSprites) {
          if (s.userData.slug === 'library' && s.userData.username !== 'staging-user') {
            s.scale.setScalar(1.1);
          }
        }
      }
    }

    function clearWinState() {
      // Reset overlays
      for (const slug of Object.keys(roomOverlays)) {
        roomOverlays[slug].material.opacity = 0;
      }
      // Reset token colors
      for (const s of playerSprites) {
        s.material.color.set(0xffffff);
        s.scale.set(0.38, 0.38, 1);
      }
      document.getElementById('win-banner').style.display = 'none';
    }

    let lastRoundId = null;
    let lastStatus = null;

    async function pollState() {
      try {
        const res = await fetch('/api/game/state', { headers: authHeaders });
        if (!res.ok) return;
        const state = await res.json();
        currentState = state;
        updateHUD(state);

        const roundChanged = state.round?.id !== lastRoundId;
        const statusChanged = state.round?.status !== lastStatus;

        if (roundChanged || statusChanged) {
          clearWinState();
          placePlayerTokens(state.players || []);

          if (state.round?.status === 'completed') {
            applyWinState(state);
          }
          lastRoundId = state.round?.id;
          lastStatus = state.round?.status;

          // Refresh outline objects after scene changes
          const newObjects = [];
          scene.traverse(obj => { if (obj.isMesh) newObjects.push(obj); });
          outlinePass.selectedObjects = newObjects;
        }
      } catch (e) {
        console.warn('Poll error:', e.message);
      }
    }

    pollState();
    setInterval(pollState, 3000);

    // ── Room click raycasting ─────────────────────────────────────────────────
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    canvas.addEventListener('click', e => {
      if (!currentState.round || currentState.round.status !== 'active') return;
      if (currentState.bet) return; // Already bet

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(scene.children, true);
      if (!intersects.length) return;

      // Find which room was hit
      let hitObj = intersects[0].object;
      while (hitObj.parent && !hitObj.userData.roomSlug) {
        // Traverse up to find room group
        if (hitObj.parent.userData && hitObj.parent.userData.roomSlug) {
          hitObj = hitObj.parent;
          break;
        }
        hitObj = hitObj.parent;
      }

      // Tag room groups with their slug
      const pos = intersects[0].point;
      const hitRoom = ROOMS.find(r => {
        if (!r.slug) return false;
        const cx = r.gridX * GRID_SPACING;
        const cz = r.gridZ * GRID_SPACING;
        return Math.abs(pos.x - cx) < ROOM_W / 2 + 0.1 && Math.abs(pos.z - cz) < ROOM_D / 2 + 0.1;
      });

      if (hitRoom && hitRoom.slug) {
        selectedRoom = hitRoom;
        document.getElementById('modal-title').textContent = 'Place Your Bet';
        document.getElementById('modal-room').textContent = `Room: ${hitRoom.label}`;
        document.getElementById('bet-modal').style.display = 'block';
      }
    });

    document.getElementById('modal-cancel').addEventListener('click', () => {
      document.getElementById('bet-modal').style.display = 'none';
      selectedRoom = null;
    });

    document.getElementById('modal-confirm').addEventListener('click', async () => {
      if (!selectedRoom) return;
      document.getElementById('bet-modal').style.display = 'none';
      try {
        const res = await fetch('/api/game/bet', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeaders },
          body: JSON.stringify({ room_slug: selectedRoom.slug, amount_tkn: 1000 }),
        });
        if (res.ok) {
          await pollState();
        } else {
          const err = await res.json();
          alert(err.error || 'Bet failed');
        }
      } catch (e) { console.error(e); }
      selectedRoom = null;
    });

    // ── Animation loop ────────────────────────────────────────────────────────
    let t = 0;
    // Corridor waypoints for ghost patrol
    const corridorPath = [
      { x: 4, z: 12 }, { x: 8, z: 12 }, { x: 12, z: 12 },
      { x: 12, z: 8 }, { x: 12, z: 4 }, { x: 12, z: 0 },
    ];
    let pathIdx = 0;
    let pathProgress = 0;

    function animate() {
      requestAnimationFrame(animate);
      t += 0.016;

      // Ghost patrol (only in neutral state)
      if (pocongSprite && currentState.round?.status !== 'completed') {
        const a = corridorPath[pathIdx];
        const b = corridorPath[(pathIdx + 1) % corridorPath.length];
        pathProgress += 0.003;
        if (pathProgress >= 1) { pathProgress = 0; pathIdx = (pathIdx + 1) % corridorPath.length; }
        pocongSprite.position.x = a.x + (b.x - a.x) * pathProgress;
        pocongSprite.position.z = a.z + (b.z - a.z) * pathProgress;
        // Bob
        pocongSprite.position.y = 0.9 + Math.sin(t * 2) * 0.08;
      } else if (pocongSprite && currentState.round?.status === 'completed') {
        // Still bob in place
        pocongSprite.position.y = 0.9 + Math.sin(t * 2) * 0.08;
      }

      composer.render();
    }

    animate();

    // ── Resize handler ────────────────────────────────────────────────────────
    window.addEventListener('resize', () => {
      const w = window.innerWidth, h = window.innerHeight;
      const a = w / h;
      camera.left = -viewSize * a; camera.right = viewSize * a;
      camera.top = viewSize; camera.bottom = -viewSize;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
    });
  </script>
</body>
</html>
